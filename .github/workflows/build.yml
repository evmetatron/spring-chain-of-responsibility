name: Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]

    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    steps:
      - name: Set up git checkout
        uses: actions/checkout@v7

      - name: Set up java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Check formatting
        run: mvn -B spotless:check

      - name: Run tests
        run: mvn -B --errors clean test

      - name: Build jar
        run: mvn -B --errors package -DskipTests

      - name: Generate test coverage report
        run: mvn jacoco:report

      - name: Save coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report-java${{ matrix.java }}
          path: target/site/jacoco/

      - name: Write JUnit Summary
        if: always()
        run: |
          TOTAL=$(grep -o 'tests="[0-9]*"' target/surefire-reports/*.xml | sed 's/[^0-9]//g' | awk '{sum+=$1} END {print sum}')
          FAILURES=$(grep -o 'failures="[0-9]*"' target/surefire-reports/*.xml | sed 's/[^0-9]//g' | awk '{sum+=$1} END {print sum}')
          ERRORS=$(grep -o 'errors="[0-9]*"' target/surefire-reports/*.xml | sed 's/[^0-9]//g' | awk '{sum+=$1} END {print sum}')

          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Total: $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- Failures: $FAILURES" >> $GITHUB_STEP_SUMMARY
          echo "- Errors: $ERRORS" >> $GITHUB_STEP_SUMMARY

      - name: Generate JaCoCo coverage badge and summary
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv

      - name: Commit updated coverage badge
        if: matrix.java == 21 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain -- .github/badges/jacoco.svg)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add .github/badges/jacoco.svg
            git commit -m "chore: Update JaCoCo coverage badge"
            git push origin HEAD:main
          fi